<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tripami</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--text-primary); font-family: var(--font-ui); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .stem { fill: var(--action-primary); }
  .dot { fill: var(--brand-orange); }
  .tint { fill: var(--accent-subtle); }
  .m1 { fill: var(--member-lagoon); }
  .m2 { fill: var(--member-sky); }
  .m3 { fill: var(--member-iris); }
  .ring { fill: none; stroke: var(--canvas); stroke-width: 4; }
  .card { rx: var(--radius-lg); }
  /* The real wordmark stands in for a typed name. It has no reversed version, so it sits on a logo-ground plate (invisible on light canvas). */
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); width: 440px; box-sizing: border-box; padding: var(--space-4) var(--space-5) var(--space-5); background: var(--logo-ground); border-radius: var(--radius-lg); }
  .logo { display: block; width: 400px; height: auto; margin: -24px 0 -20px -36px; }
  .tag { margin: var(--space-2) 0 0; font-size: 14px; line-height: 20px; color: var(--brand-navy); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      action-primary stem 96×192 (navy; paper in dark) bled off the bottom · brand-orange dot r44 · accent-subtle tint 336×144 bled off the right · member-lagoon, member-sky, member-iris as 56px discs — ≈30% of 960×288
  arrangement the logo's own "i": a navy stem with the orange dot a space-3 gap above it, beside one wide tint slab; the stack of people sits on the ground under the tint
  pattern     the literal motif, the dot on the i, plus "a circle is a person": three overlapping member discs at −space-2 with a canvas ring, the avatar stack
  scales      stem width 96 = 4× space-6; gaps space-3 and space-4; corners radius-lg (24); member discs 56 = size-quick-action, overlap space-2, ring 2× the 2px avatar stroke
-->
<circle class="dot" cx="88" cy="68" r="44"/>
<rect class="stem card" x="40" y="124" width="96" height="192" rx="24"/>
<rect class="tint card" x="152" y="40" width="352" height="144" rx="24"/>
<circle class="m1" cx="196" cy="236" r="28"/><circle class="ring" cx="196" cy="236" r="28"/>
<circle class="m2" cx="244" cy="236" r="28"/><circle class="ring" cx="244" cy="236" r="28"/>
<circle class="m3" cx="292" cy="236" r="28"/><circle class="ring" cx="292" cy="236" r="28"/>
</svg>
</div>
<div class="words">
<img class="logo" src="/_blob/4ce3ab8133eb58391fba2ee1fe704ccf" alt="Tripami">
<p class="tag">Group trips, set quietly. Places and people bring the color.</p>
</div>
</div>
</body>
</html>
